<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <!-- 适配手机端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhao, Dingcheng - Homepage</title>
    <!-- 引入Bootstrap简化样式（无需自己写大量CSS） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <style>
        /* 页面整体样式 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        /* 导航栏样式 */
        .navbar {
            background-color: #343a40 !important;
        }
        /* 首页个人简介区域 */
        .profile-section {
            padding: 80px 0;
            text-align: center;
        }
        .profile-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 5px solid #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* 语言切换按钮样式 */

        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border: 1px solid #b29f9f;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.85) !important;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            margin-left: 8px;
        }
        .lang-switch:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.8);
            color: #fff !important;
        }
        .lang-switch svg {
            flex-shrink: 0;
        }
        
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Zhao, Dingcheng</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Me</a></li>
                    <li class="nav-item">
                        <a class="nav-link lang-switch" href="index-CN.html">
                            <!-- 地球 SVG 图标 -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                            切换中文
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 首页个人简介 -->
    <section class="profile-section">
        <div class="container">
            <!-- 首页头像 -->
            <img src="meSmall.jpg" alt="头像" class="profile-avatar">
            <h1>Zhao, Dingcheng</h1>
            <p class="lead">Computer Science · Sophomore</p>
            <p class="lead">The University of Hong Kong</p>
            <p>Machine Learning, LLM | Financial Computing, Financial Technology</p>
            <!-- 按钮 -->
            <a href="about.html" class="btn btn-primary btn-lg m-2">Learn More</a>
            
        </div>
    </section>

    <!-- 引入Bootstrap的JS（实现导航栏折叠等交互） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
