<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhao, Dingcheng - Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --accent: #7c3aed;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 24px rgba(30,41,59,0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* ── Navbar ── */
        .navbar {
            background: rgba(15, 23, 42, 0.97) !important;
            backdrop-filter: blur(12px);
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            color: #fff !important;
        }
        .nav-link {
            font-size: 0.875rem;
            font-weight: 500;
            color: rgba(255,255,255,0.75) !important;
            transition: color 0.2s;
            padding: 0.4rem 0.75rem !important;
            border-radius: 6px;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff !important;
            background: rgba(255,255,255,0.1);
        }
        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 0.3rem 0.7rem !important;
            border-radius: 20px;
        }
        .lang-switch:hover { border-color: rgba(255,255,255,0.6); }

        /* ── Hero / Profile Section ── */
        .profile-section {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #2563eb 100%);
            padding: 100px 0 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .profile-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 60% 40%, rgba(124,58,237,0.2) 0%, transparent 65%);
        }
        .profile-section .container {
            position: relative;
            z-index: 1;
        }
        .profile-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            object-position: top;
            margin-bottom: 24px;
            border: 4px solid rgba(255,255,255,0.25);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 14px 44px rgba(0,0,0,0.5);
        }
        .profile-section h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.4rem;
        }
        .profile-section .lead {
            font-size: 1rem;
            color: rgba(255,255,255,0.75);
            margin-bottom: 0.3rem;
            font-weight: 400;
        }
        .profile-section p:not(.lead) {
            color: rgba(255,255,255,0.55);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        /* ── Tags (interests) ── */
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2rem;
        }
        .hero-tag {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.88);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        /* ── CTA Button ── */
        .btn-hero {
            background: #fff;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.92rem;
            padding: 10px 28px;
            border-radius: 10px;
            text-decoration: none;
            border: none;
            display: inline-block;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
        }
        .btn-hero:hover {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 6px 24px rgba(37,99,235,0.45);
            transform: translateY(-2px);
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .profile-section { padding: 70px 0 60px; }
            .profile-section h1 { font-size: 1.9rem; }
            .profile-avatar { width: 130px; height: 130px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Zhao, Dingcheng</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-1">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Me</a></li>
                    <li class="nav-item">
                        <a class="nav-link lang-switch" href="index-CN.html">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                            </svg>
                            切换中文
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 首页个人简介 -->
    <section class="profile-section">
        <div class="container">
            <!-- 首页头像 -->
            <img src="meSmall.jpg" alt="头像" class="profile-avatar">
            <h1>Zhao, Dingcheng</h1>
            <p class="lead">Computer Science · Sophomore</p>
            <p class="lead">The University of Hong Kong</p>
            <p>Machine Learning, LLM | Financial Computing, Financial Technology</p>
            <!-- 兴趣标签 -->
            <div class="hero-tags">
                <span class="hero-tag">🤖 Machine Learning</span>
                <span class="hero-tag">💬 LLMs</span>
                <span class="hero-tag">📈 Financial Computing</span>
                <span class="hero-tag">💡 FinTech</span>
            </div>
            <!-- 按钮 -->
            <a href="about.html" class="btn-hero">Learn More</a>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
